[project]
name = "aiteam-relay"
version = "0.1.0"
description = "aiteam.space unified MCP relay (mcp.aiteam.space): one URL for every Son, OAuth via aiteam.space + RFC 8693 token exchange"
requires-python = ">=3.11"
dependencies = ["starlette>=0.40", "uvicorn>=0.30", "httpx>=0.27", "cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
aiteam-relay = "aiteam_relay.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aiteam_relay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
