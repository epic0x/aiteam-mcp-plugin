[project]
name = "aiteam-connector"
version = "0.1.0"
description = "AI Teamspace Plugin MCP Connector: drive your Hermes Sons from Claude and ChatGPT (MCP + messaging box)"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "httpx>=0.27", "aiohttp>=3.9", "uvicorn>=0.30", "starlette>=0.40", "jsonschema>=4"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "cryptography>=42"]

[project.scripts]
aiteam-connector = "aiteam_connector.server:main"
aiteam-box = "aiteam_connector.box:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aiteam_connector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
