name: package-check
# The ChatGPT plugin package: run the builder tests and a non-strict build.
# Tags + manual runs only. release.yml runs the same builder tests on every v* tag;
# locally: scripts/box-test.sh.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_package.py
      - name: Build (placeholders reported, not fatal)
        run: |
          python3 scripts/build_package.py --version 0.0.0-check --out dist
          cat dist/PLACEHOLDERS.md >> "$GITHUB_STEP_SUMMARY"
